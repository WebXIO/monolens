# Builds and tests the app on every desktop platform it ships to. Only Linux is used day to day,
# so this is where macOS and Windows get compiled and tested at all.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch or pull request makes the running check pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # one platform failing shouldn't hide whether the others pass
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install the Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Vite 8 needs Node 20.19 or 22.12 and newer
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # the version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:frontend --run

      # also creates dist/, which the Tauri crate embeds
      - run: pnpm build

      - run: cargo test
        working-directory: src-tauri

      # the 2 module_inception warnings are known, so warnings don't fail the job
      - run: cargo clippy --all-targets
        working-directory: src-tauri
